services:
  # Backend Service
  - type: web
    name: cms-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free # Change to a paid plan if needed
    envVars:
      - key: PORT
        value: 8081
      - fromGroup: cms-secrets

  # Frontend Service (Static Site is cheaper and faster)
  - type: web
    name: cms-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cms-backend
          property: host
      - fromGroup: cms-secrets

envVarGroups:
  - name: cms-secrets
    envVars:
      - key: SUPABASE_URL
        value: "" # Fill this in Render UI
      - key: SUPABASE_ANON_KEY
        value: "" # Fill this in Render UI
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: "" # Fill this in Render UI
      - key: DATABASE_URL
        value: "" # Fill this in Render UI
      - key: JWT_SECRET
        value: "" # Fill this in Render UI
